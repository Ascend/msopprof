<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">优化二：双缓冲让 MTE2、VECTOR、MTE3 流水重叠</title>
  <desc id="desc">上半部分展示单缓冲严格串行，下半部分展示两个连续 32×32 UB 缓冲交替后相邻迭代的 MTE2、VECTOR、MTE3 重叠。</desc>
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #172033; }
      .head { font: 700 20px sans-serif; fill: #27344a; }
      .label { font: 600 15px sans-serif; fill: #27344a; }
      .small { font: 14px sans-serif; fill: #536176; }
      .metric { font: 700 18px monospace; fill: #172033; }
      .inside { font: 700 13px sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#f8fafc"/>
  <text x="48" y="52" class="title">优化 2：单 Buffer 串行 → 双 Buffer 跨迭代并行</text>

  <rect x="42" y="88" width="1116" height="220" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="68" y="124" class="head">Case 1：同一个输入/输出 Buffer 被三条 Pipe 依次占用</text>
  <g class="label"><text x="68" y="177">MTE2</text><text x="68" y="225">VECTOR</text><text x="68" y="273">MTE3</text></g>
  <line x1="145" y1="151" x2="1120" y2="151" stroke="#cbd5e1"/><line x1="145" y1="199" x2="1120" y2="199" stroke="#cbd5e1"/><line x1="145" y1="247" x2="1120" y2="247" stroke="#cbd5e1"/>
  <g>
    <rect x="158" y="158" width="105" height="30" rx="5" fill="#f59e0b"/><text x="210" y="179" class="inside">load 0</text>
    <rect x="263" y="206" width="150" height="30" rx="5" fill="#6366f1"/><text x="338" y="227" class="inside">VF 0</text>
    <rect x="413" y="254" width="82" height="30" rx="5" fill="#10b981"/><text x="454" y="275" class="inside">store 0</text>
    <rect x="495" y="158" width="105" height="30" rx="5" fill="#f59e0b"/><text x="547" y="179" class="inside">load 1</text>
    <rect x="600" y="206" width="150" height="30" rx="5" fill="#6366f1"/><text x="675" y="227" class="inside">VF 1</text>
    <rect x="750" y="254" width="82" height="30" rx="5" fill="#10b981"/><text x="791" y="275" class="inside">store 1</text>
    <rect x="832" y="158" width="105" height="30" rx="5" fill="#f59e0b"/><text x="884" y="179" class="inside">load 2</text>
    <rect x="937" y="206" width="150" height="30" rx="5" fill="#6366f1"/><text x="1012" y="227" class="inside">VF 2</text>
  </g>
  <text x="760" y="292" class="small">PipeTimeline：数据 Pipe 完全串行，并发度 = 1.00</text>

  <rect x="42" y="332" width="1116" height="254" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="68" y="368" class="head">Case 2：Buffer 0 / 1 交替；mutex 只保护同一个 Buffer 的依赖</text>
  <g class="label"><text x="68" y="425">MTE2</text><text x="68" y="473">VECTOR</text><text x="68" y="521">MTE3</text></g>
  <line x1="145" y1="399" x2="1120" y2="399" stroke="#cbd5e1"/><line x1="145" y1="447" x2="1120" y2="447" stroke="#cbd5e1"/><line x1="145" y1="495" x2="1120" y2="495" stroke="#cbd5e1"/>
  <g>
    <rect x="158" y="406" width="184" height="30" rx="5" fill="#f59e0b"/><text x="250" y="427" class="inside">load 0 · B0</text>
    <rect x="290" y="454" width="184" height="30" rx="5" fill="#6366f1"/><text x="382" y="475" class="inside">VF 0 · B0</text>
    <rect x="342" y="406" width="210" height="30" rx="5" fill="#f59e0b"/><text x="447" y="427" class="inside">load 1 · B1</text>
    <rect x="420" y="502" width="166" height="30" rx="5" fill="#10b981"/><text x="503" y="523" class="inside">store 0 · B0</text>
    <rect x="486" y="454" width="184" height="30" rx="5" fill="#6366f1"/><text x="578" y="475" class="inside">VF 1 · B1</text>
    <rect x="552" y="406" width="214" height="30" rx="5" fill="#f59e0b"/><text x="659" y="427" class="inside">load 2 · B0</text>
    <rect x="596" y="502" width="178" height="30" rx="5" fill="#10b981"/><text x="685" y="523" class="inside">store 1 · B1</text>
    <rect x="686" y="454" width="184" height="30" rx="5" fill="#6366f1"/><text x="778" y="475" class="inside">VF 2 · B0</text>
    <rect x="766" y="406" width="214" height="30" rx="5" fill="#f59e0b"/><text x="873" y="427" class="inside">load 3 · B1</text>
    <rect x="790" y="502" width="178" height="30" rx="5" fill="#10b981"/><text x="879" y="523" class="inside">store 2 · B0</text>
  </g>
  <text x="158" y="563" class="small">两个 Case 都保持连续 32×32 UB 布局；只增加双缓冲和独立 mutex，GM 读写流量不变</text>

  <rect x="42" y="612" width="1116" height="48" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="66" y="642" class="metric">流水并发度 1.00 → 2.06 · Task Duration 22.383 → 16.581 μs（1.35×）· VECTOR 时间基本不变</text>
</svg>
